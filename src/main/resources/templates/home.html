<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User List</title>
    <style>
        body {
            display: flex;
            font-family: Arial;
        }
        .sidebar {
            width: 200px;
            background-color: #f2f2f2;
            padding: 20px;
            height: 100vh;
        }
        .content {
            flex: 1;
            padding: 20px;
        }
        .user-row {
            display: flex;
            justify-content: space-between;
            background-color: #f9f9f9;
            padding: 10px;
            margin-bottom: 10px;
            align-items: center;
            border: 1px solid #ddd;
        }
        .user-info {
            display: flex;
            gap: 20px;
            flex: 1;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .icon-btn {
            cursor: pointer;
            color: #007bff;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <h2>Menu</h2>
    <ul>
        <li><a href="#">Users</a></li>
    </ul>
</div>

<div class="content">
    <!-- Add User Button -->
    <button onclick="showAddUserDialog()">➕ Add User</button>

    <!-- Add User Dialog -->
    <div id="addUserDialog" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background-color:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
        <div style="background:white; padding:20px; border-radius:10px; min-width:300px;">
            <h2>Add New User</h2>
            <label>Name:</label><br />
            <input type="text" id="newName"><br /><br />
            <label>Email:</label><br />
            <input type="email" id="newEmail"><br /><br />
            <label>Mobile:</label><br />
            <input type="text" id="newMobile"><br /><br />
            <label>Password:</label><br />
            <input type="password" id="newPassword"><br /><br />
            <button onclick="addUser()">Submit</button>
            <button onclick="hideAddUserDialog()">Cancel</button>
        </div>
    </div>

    <h1>User List</h1>
    <div id="userList"></div>
</div>

<script>
    async function fetchUsers() {
        try {
            const response = await fetch('/api/get-all-users');
            if (!response.ok) throw new Error('Network response was not ok');

            const result = await response.json();
            if (!result.status) return alert('Error: ' + result.message);

            const users = result.data;
            const userList = document.getElementById('userList');
            userList.innerHTML = '';

            users.forEach(user => {
                const row = document.createElement('div');
                row.className = 'user-row';
                row.innerHTML = `
                    <div class="user-info">
                        <div><strong>Name:</strong> <input value="${user.name}" id="name-${user.id}" /></div>
                        <div><strong>Email:</strong> <input value="${user.emailId}" id="email-${user.id}" /></div>
                        <div><strong>Mobile:</strong> <input value="${user.mobileNo}" id="mobile-${user.id}" /></div>
                    </div>
                    <div class="actions">
                        <span class="icon-btn" onclick="updateUser(${user.id})">✏️</span>
                        <span class="icon-btn" onclick="deleteUser(${user.id})">🗑️</span>
                    </div>
                `;
                userList.appendChild(row);
            });
        } catch (error) {
            console.error('Error fetching users:', error);
        }
    }

    async function updateUser(id) {
        const name = document.getElementById(`name-${id}`).value;
        const email = document.getElementById(`email-${id}`).value;
        const mobile = document.getElementById(`mobile-${id}`).value;

        const updatedUser = { name, emailId: email, mobileNo: mobile };

        try {
            const response = await fetch(`/api/users/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedUser)
            });

            const result = await response.json();
            alert(result.message);
            if (result.status) fetchUsers(); // refresh list
        } catch (e) {
            alert('Update failed: ' + e.message);
        }
    }

    async function deleteUser(id) {
        if (!confirm('Are you sure you want to delete this user?')) return;

        try {
            const response = await fetch(`/api/users/${id}`, {
                method: 'DELETE'
            });

            const result = await response.json();
            alert(result.message);
            if (result.status) fetchUsers(); // refresh list
        } catch (e) {
            alert('Delete failed: ' + e.message);
        }
    }

    function showAddUserDialog() {
    document.getElementById('addUserDialog').style.display = 'flex';
}

function hideAddUserDialog() {
    document.getElementById('addUserDialog').style.display = 'none';
}

async function addUser() {
    const name = document.getElementById('newName').value.trim();
    const emailId = document.getElementById('newEmail').value.trim();
    const mobileNo = document.getElementById('newMobile').value.trim();
    const password = document.getElementById('newPassword').value;

    if (!name || !emailId || !mobileNo || !password) {
        alert('All fields are required');
        return;
    }

    try {
        const formData = new URLSearchParams();
        formData.append("name", name);
        formData.append("emailId", emailId);
        formData.append("mobileNo", mobileNo);
        formData.append("password", password);

        const response = await fetch("/api/create-user", {
            method: "POST",
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: formData
        });

        const result = await response.json();
        alert(result.message);
        if (result.status) {
<!--            // ✅ Clear the input fields-->
<!--            nameInput.value = '';-->
<!--            emailInput.value = '';-->
<!--            mobileInput.value = '';-->
<!--            passwordInput.value = '';-->

            hideAddUserDialog();
            fetchUsers(); // refresh list
        }
    } catch (error) {
        alert("Failed to add user: " + error.message);
    }
}

    window.onload = fetchUsers;
</script>
</body>
</html>
